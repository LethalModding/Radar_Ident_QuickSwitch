version: 2
# Dependabot can only reach registries listed here, and the project restores from these feeds (PlayerMapNumbers/NuGet.Config and the csproj).
registries:
  bepinex:
    type: nuget-feed
    url: https://nuget.bepinex.dev/v3/index.json
  samboy:
    type: nuget-feed
    url: https://nuget.samboy.dev/v3/index.json
updates:
  - package-ecosystem: nuget
    directory: /
    registries:
      - bepinex
      - samboy
    schedule:
      interval: weekly
